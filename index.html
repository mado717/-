<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Ариночки 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3ec; --bg2:#ffc2d4; --paper:#fff8fa; --ink:#7a1033; --rose:#e8305f; --deep:#b01445; --soft:#f58aa8; --shadow:rgba(176,20,69,.28);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a0a17; --bg2:#4a1127; --paper:#fff0f4; --ink:#7a1033; --rose:#ff4d7d; --deep:#d81b5b; --soft:#ff8fb0; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{--bg1:#2a0a17;--bg2:#4a1127;--paper:#fff0f4;--ink:#7a1033;--rose:#ff4d7d;--deep:#d81b5b;--soft:#ff8fb0;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg1) 70%);
  font-family:"Nunito",system-ui,sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
#rain{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.h{position:absolute;bottom:-40px;color:var(--rose);opacity:.55;animation:up linear infinite;will-change:transform}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}

main{position:relative;z-index:2;width:min(92vw,440px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}

/* envelope */
.env{position:relative;width:min(80vw,300px);aspect-ratio:3/2;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;
  filter:drop-shadow(0 18px 26px var(--shadow));transition:transform .4s}
.env:hover{transform:scale(1.03)}
.env:focus-visible{outline:3px solid var(--rose);outline-offset:8px;border-radius:12px}
.back{position:absolute;inset:0;background:var(--deep);border-radius:10px}
.front{position:absolute;inset:0;border-radius:10px;z-index:3;
  background:
   linear-gradient(to top right,transparent 49.5%,var(--rose) 50%) left/50.2% 100% no-repeat,
   linear-gradient(to top left,transparent 49.5%,var(--rose) 50%) right/50.2% 100% no-repeat;
  clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.front{background:linear-gradient(160deg,var(--rose),var(--deep))}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:top;transition:transform .7s ease,z-index 0s .35s;
  background:linear-gradient(180deg,var(--soft),var(--rose));clip-path:polygon(0 0,100% 0,50% 100%)}
.seal{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);font-size:34px;line-height:1;transition:opacity .3s}
.hint{font-family:"Marck Script",cursive;font-size:1.6rem;color:var(--ink);transition:opacity .4s}
:root[data-theme="dark"] .hint,
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hint{color:#ffd3e0} }
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0}
.open .hint{opacity:0;pointer-events:none;position:absolute}

/* letter */
.letter{
  display:none;position:relative;width:100%;padding:34px 26px 28px;border-radius:18px;background:var(--paper);
  box-shadow:0 24px 50px var(--shadow);
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(232,48,95,.12) 33px 34px);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
.letter.show{display:block}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.92)}to{opacity:1;transform:none}}
.big{font-size:54px;line-height:1;animation:beat 1.2s ease-in-out infinite;display:inline-block}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
h1{font-family:"Marck Script",cursive;font-weight:400;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1.05;margin:10px 0 14px;color:var(--deep)}
p{font-family:"Marck Script",cursive;font-size:clamp(1.5rem,6.2vw,1.9rem);line-height:1.35;margin:0 0 22px}
p b{font-weight:400;color:var(--rose)}
.bite{font:800 1.05rem "Nunito",sans-serif;color:#fff;background:linear-gradient(135deg,var(--rose),var(--deep));border:0;border-radius:999px;padding:14px 30px;cursor:pointer;
  box-shadow:0 8px 18px var(--shadow);transition:transform .15s}
.bite:hover{transform:translateY(-2px)}
.bite:active{transform:scale(.94)}
.bite:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.pop{position:fixed;z-index:9;pointer-events:none;font-size:26px;animation:pop 1.1s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.h,.big{animation:none}.letter{animation:none}.flap{transition:none}}
</style>
</head>
<body>
<div id="rain" aria-hidden="true"></div>
<main>
  <button class="env" id="env" aria-label="Открыть письмо">
    <span class="back"></span><span class="front"></span><span class="flap"></span><span class="seal">💗</span>
  </button>
  <div class="hint" id="hint">Это тебе… открой 💌</div>

  <section class="letter" id="letter" aria-live="polite">
    <div class="big" aria-hidden="true">💖</div>
    <h1>Привет, Ариночка!</h1>
    <p>Я тебя <b>очень очень</b> люблю,<br>кусю тибя 💕</p>
    <button class="bite" id="bite">Кусю ❤️</button>
  </section>
</main>
<script>
(function(){
  var rain=document.getElementById('rain'),icons=['♥','❤','💗','💕'];
  for(var i=0;i<22;i++){
    var s=document.createElement('span');s.className='h';s.textContent=icons[i%icons.length];
    s.style.left=(Math.random()*100)+'%';
    s.style.fontSize=(14+Math.random()*26)+'px';
    s.style.animationDuration=(9+Math.random()*10)+'s';
    s.style.animationDelay=(-Math.random()*18)+'s';
    rain.appendChild(s);
  }
  var env=document.getElementById('env'),letter=document.getElementById('letter'),main=env.parentNode;
  env.addEventListener('click',function(){
    env.classList.add('open');
    setTimeout(function(){env.style.display='none';document.getElementById('hint').style.display='none';letter.classList.add('show')},750);
  });
  function burst(x,y){
    var set=['💗','💖','💕','❤️','💘'];
    for(var i=0;i<12;i++){
      var p=document.createElement('span');p.className='pop';p.textContent=set[Math.floor(Math.random()*set.length)];
      var a=Math.random()*Math.PI*2,d=60+Math.random()*110;
      p.style.left=x+'px';p.style.top=y+'px';
      p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',(Math.sin(a)*d-40)+'px');
      document.body.appendChild(p);
      setTimeout(function(el){return function(){el.remove()}}(p),1200);
    }
  }
  document.getElementById('bite').addEventListener('click',function(e){
    var r=e.currentTarget.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2);
  });
})();
</script>
</body>
</html>
